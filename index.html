<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>두툼버거 주방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: 타일 벽 위의 나무 카운터(손님 3자리) → 스테인리스 조리대(그릴 · 접시 · 재료통)가 위에서 아래로 이어지는 한 화면 주방 */
:root{
  --wall:#123c3b; --wall-deep:#0b2a29; --tile-line:rgba(255,255,255,.055);
  --paper:#fff8ec; --ink:#221c17; --ink-soft:#5d544b;
  --mustard:#f2b134; --ketchup:#d63f2a; --pickle:#5f9e3a;
  --wood:#9a5a2a; --wood-dark:#6e3c18;
  --steel:#cdd5d3; --steel-dark:#aab4b2; --iron:#1d2122;
  --wall-text:#f1ede2;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --body:'Gowun Dodum',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --poem:'Gowun Batang','Batang',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background-color:var(--wall);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:46px 46px;
  color:var(--wall-text); font-family:var(--body); font-size:15px;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
kbd{font-family:var(--display);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.12);color:var(--ink-soft);letter-spacing:.04em}

.app{max-width:1080px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:30px;color:var(--mustard);margin-right:auto;line-height:1;text-shadow:0 3px 0 var(--wall-deep)}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--wall-text);opacity:.7;letter-spacing:.08em;margin-top:4px}
.stat{background:rgba(0,0,0,.28);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;gap:2px;min-width:72px}
.stat .lbl{font-size:11px;letter-spacing:.08em;opacity:.75}
.stat b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.goal{min-width:170px}
.stat.goal small{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.goalbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
.goalbar i{display:block;height:100%;width:0;background:var(--mustard)}
.stat.warn .goalbar i{background:#ff8a70}
.goalbar i.met{background:#7fd05a}
.stat.warn b{color:#ff8a70;animation:blink 1s steps(2) infinite}
.hud-btn{background:rgba(0,0,0,.28);border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
.hud-btn:hover{background:rgba(0,0,0,.4)}

/* 카운터 */
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 12px 0;border-bottom:16px solid var(--wood);box-shadow:0 6px 0 var(--wood-dark);border-radius:14px 14px 0 0;background:rgba(0,0,0,.14)}
.seat-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.seat-wrap .seat{flex:1}
.skip{align-self:center;border:0;border-radius:999px;padding:5px 12px;margin-bottom:8px;background:rgba(0,0,0,.3);color:var(--wall-text);font-family:var(--display);font-size:13px;cursor:pointer}
.skip:hover{background:var(--ketchup);color:#fff}
.skip small{font-family:var(--body);font-size:11px;opacity:.8}
.skip-gap{display:block;height:34px}
.seat{position:relative;display:grid;grid-template-columns:70px 1fr;grid-template-rows:1fr auto;gap:8px 10px;align-items:end;min-height:196px;padding:10px 10px 12px;border:0;border-radius:12px 12px 0 0;background:transparent;text-align:left;cursor:pointer}
.seat:hover:not(:disabled){background:rgba(242,177,52,.12)}
.seat:disabled{cursor:default}
.seat.empty{display:flex;align-items:center;justify-content:center;color:var(--wall-text);opacity:.35;font-family:var(--display);font-size:16px}
.seat .key{position:absolute;top:8px;left:10px;font-family:var(--display);font-size:12px;opacity:.6}
.seat.shake{animation:shake .45s}

.person{display:flex;flex-direction:column;align-items:center;transition:transform .3s}
.head{width:52px;height:52px;border-radius:50%;background:var(--skin);position:relative;z-index:1}
.head i{position:absolute;display:block}
.hair{inset:-3px -3px auto -3px;height:22px;border-radius:30px 30px 10px 10px;background:var(--hair)}
.eye{top:25px;width:6px;height:7px;border-radius:50%;background:#1f1a16}
.eye.l{left:14px}.eye.r{right:14px}
.mouth{left:50%;top:35px;width:16px;height:8px;transform:translateX(-50%);border:3px solid #1f1a16;border-top:0;border-radius:0 0 12px 12px;box-sizing:border-box}
.blush{left:6px;right:6px;top:33px;height:6px;background:radial-gradient(circle at 10% 50%,rgba(230,90,90,.45) 3px,transparent 4px),radial-gradient(circle at 90% 50%,rgba(230,90,90,.45) 3px,transparent 4px)}
.torso{width:62px;height:34px;border-radius:26px 26px 6px 6px;background:var(--shirt);margin-top:-5px}
.mood-meh .mouth{height:0;top:39px;border-width:3px 0 0;border-radius:0;width:14px}
.mood-mad .mouth{top:37px;height:7px;border:3px solid #1f1a16;border-bottom:0;border-radius:12px 12px 0 0}
.mood-mad .head{background:color-mix(in srgb,var(--skin),#e0402a 32%)}
.mood-mad .eye{height:4px;top:27px}
.mood-yay .mouth{height:11px;width:20px;background:#7a2318;border-color:#1f1a16}
.mood-yay{transform:translateY(-6px)}
.leaving .person{opacity:.55}

.ticket{position:relative;background:var(--paper);color:var(--ink);border-radius:3px;padding:8px 9px 9px;transform:rotate(-1.2deg);box-shadow:0 3px 0 rgba(0,0,0,.25);align-self:start;margin-top:14px}
.seat-wrap:nth-child(2) .ticket{transform:rotate(.8deg)}
.ticket::before{content:"";position:absolute;top:-6px;left:50%;width:22px;height:10px;margin-left:-11px;background:rgba(242,177,52,.85);border-radius:2px}
.t-name{font-family:var(--display);font-size:16px;line-height:1.1}
.t-body{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.t-lines{list-style:none;margin:6px 0 0;padding:4px 0 0;border-top:1px dashed rgba(34,28,23,.25);font-family:var(--poem);font-weight:700;font-size:13.5px;line-height:1.55}
.t-lines .x{font-family:var(--display);font-weight:400;color:var(--ketchup)}
.t-lines.initial{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.18em;line-height:1.4}
.t-lines.initial .x{letter-spacing:0}
.t-lines.answer{font-family:var(--display);font-weight:400;font-size:15px;color:#2f6d1d}
.t-answer{display:inline-block;margin-top:6px;padding:1px 6px;border-radius:5px;background:#e1f4d6;color:#2f6d1d;font-family:var(--display);font-size:11px;letter-spacing:.04em}
.t-kind{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:var(--mustard);color:var(--ink);font-size:11px;vertical-align:2px;letter-spacing:.04em}
.book{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0 0 14px;background:rgba(0,0,0,.05);border-radius:8px;padding:10px 12px}
.book dt{font-family:var(--display)}
.book dd{margin:0;font-family:var(--poem);color:var(--ink-soft)}
.patience{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}
.patience i{display:block;height:100%;background:#7fd05a;border-radius:4px}
.patience i.meh{background:var(--mustard)}
.patience i.mad{background:var(--ketchup)}
.bubble{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;padding:5px 10px;border-radius:10px;white-space:nowrap;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bubble.bad{background:var(--ketchup);color:#fff}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-size:24px;color:#9df07a;text-shadow:0 2px 0 var(--wall-deep);pointer-events:none;animation:floatUp 1.1s ease-out forwards;z-index:4;white-space:nowrap}

/* 조리대 */
.line{background:linear-gradient(180deg,var(--steel),var(--steel-dark));color:var(--ink);border-radius:0 0 16px 16px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.kitchen{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
.panel-title{font-family:var(--display);font-size:15px;margin:0 0 8px;color:var(--ink-soft);letter-spacing:.04em}
.grill-wrap{background:#2b3132;color:var(--wall-text);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.grill-wrap .panel-title{color:#b9c3c1}
.grill{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1/1.08;border:0;border-radius:10px;cursor:pointer;background:repeating-linear-gradient(90deg,#141718 0 7px,#30383a 7px 9px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;overflow:hidden}
.slot:hover{box-shadow:inset 0 0 0 2px var(--mustard)}
.gp{width:62%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.25)}
.gp.none{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.gp.cooking{animation:sizzle .25s infinite alternate}
.gp.done{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #9df07a}
.gp.burnt{background:#1b1311!important;box-shadow:0 0 0 2px #000,0 0 12px rgba(255,90,40,.5)}
.gbar{width:84%;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--mustard)}
.gbar i.done{background:#9df07a}
.gbar i.burnt{background:var(--ketchup)}
.glabel{font-size:11px;line-height:1.2;text-align:center;color:#d8dfdd;min-height:2.4em}
.glabel.done{color:#9df07a;font-weight:700}
.glabel.burnt{color:#ff8a70}
.patty-btn{margin-top:10px;border:0;border-radius:10px;padding:10px;background:#e7a0a6;color:var(--ink);font-family:var(--display);font-size:16px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;box-shadow:0 3px 0 #a9646b}
.patty-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a9646b}

.plate-wrap{background:rgba(255,255,255,.45);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center}
.plate-wrap .panel-title{align-self:flex-start}
.msg{min-height:22px;font-family:var(--display);font-size:16px;color:var(--ink-soft);text-align:center}
.msg.bad{color:var(--ketchup)}
.msg.good{color:#2f7d1f}
.plate-area{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:190px;width:100%}
.plate{width:16em;max-width:100%;height:1.6em;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#ffffff 55%,#dfe5e4 70%,#b9c2c0 100%);box-shadow:0 4px 0 rgba(0,0,0,.12);margin-top:-.5em;font-size:15px}
.plate-empty{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.plate-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.tool{border:0;border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tool:active{transform:translateY(2px);box-shadow:none}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 0 0;text-align:center}

.bins{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.bin{position:relative;border:0;border-radius:12px;padding:10px 4px 8px;background:#f4f6f5;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-height:92px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bin:hover:not(:disabled){background:#fff}
.bin:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.bin:disabled{opacity:.45;cursor:not-allowed}
.bin .nm{font-family:var(--display);font-size:15px}
.bin .lock{font-size:11px;color:var(--ink-soft)}
.bin kbd{position:absolute;top:5px;left:6px}
.bin.pop{animation:pop .2s}

/* 버거 레이어 (em 단위라 크기만 바꿔 어디든 재사용) */
.stack{display:flex;flex-direction:column-reverse;align-items:center;width:12em;flex:none}
.stack.big{font-size:15px}
.stack.ticket-stack{font-size:4.6px}
.stack.bin-stack{font-size:5.4px}
.ly{flex:none;position:relative;box-sizing:border-box}
.ly + .ly{margin-bottom:-.18em}
.ly.bottom{width:88%;height:1.7em;border-radius:.3em .3em 1.1em 1.1em;background:linear-gradient(#eba95a,#c77a2e);box-shadow:inset 0 .28em 0 #f6cf91}
.ly.top{width:94%;height:3.1em;border-radius:50% 50% .45em .45em/92% 92% .45em .45em;
  background:
    radial-gradient(ellipse .32em .18em at 28% 32%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 45% 20%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 62% 30%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 76% 48%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 38% 52%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 18% 58%,#fff4da 70%,transparent 80%),
    radial-gradient(ellipse .32em .18em at 56% 55%,#fff4da 70%,transparent 80%),
    linear-gradient(#f2b866,#c77a2e);
  box-shadow:inset 0 -.3em 0 rgba(0,0,0,.12)}
.ly.patty{width:97%;height:1.4em;border-radius:.7em;background:linear-gradient(#7b4626,#4a2713);box-shadow:inset 0 .22em 0 rgba(255,255,255,.12),inset 0 -.2em 0 rgba(0,0,0,.25)}
.ly.rawpatty{width:97%;height:1.4em;border-radius:.7em;background:linear-gradient(#eaa2a6,#c46c76);box-shadow:inset 0 .22em 0 rgba(255,255,255,.18),inset 0 -.2em 0 rgba(0,0,0,.18)}
.ly.cheese{width:103%;height:.95em;background:#f7c331;clip-path:polygon(0 0,100% 0,100% 42%,91% 42%,86% 100%,80% 42%,57% 42%,51% 82%,45% 42%,22% 42%,15% 100%,9% 42%,0 42%)}
.ly.lettuce{width:107%;height:.8em;background:radial-gradient(circle at 50% 0,#6cb944 .36em,transparent .38em) 0 .3em/.8em .5em repeat-x,linear-gradient(#8bd35e,#6cb944) top/100% .38em no-repeat}
.ly.tomato{width:90%;height:.62em;border-radius:.3em;background:linear-gradient(#f0614a,#c4301e);box-shadow:inset 0 0 0 .1em #a52414}
.ly.onion{width:86%;height:.48em;border-radius:.3em;background:#f7f0fa;border:.12em solid #a46cc2}
.ly.bacon{width:100%;height:.56em;border-radius:.2em;background:repeating-linear-gradient(90deg,#b8322a 0 .9em,#f2b8a5 .9em 1.3em)}
.ly.pickle{width:84%;height:.55em;background:radial-gradient(circle,#8cba40 52%,#527720 56%,transparent 61%) 0 50%/1.4em .55em repeat-x}
.ly.egg{width:94%;height:.85em;border-radius:45%/50%;background:radial-gradient(ellipse 1.7em .5em at 52% 50%,#f6b51a 80%,#e39a0c 95%,transparent 100%),#fffdf5;box-shadow:inset 0 -.1em 0 #e9e2cf}
.ly.pineapple{width:92%;height:.62em;border-radius:.3em;background:radial-gradient(ellipse 1em .22em at 50% 50%,#c98e1c 70%,transparent 75%),repeating-linear-gradient(90deg,#f6d455 0 .7em,#e8bb30 .7em .8em);box-shadow:inset 0 0 0 .08em #c9921e}
.ly.mushroom{width:90%;height:.62em;background:radial-gradient(ellipse .7em .55em at 50% 100%,#e6c9a4 55%,#8a5c38 60%,transparent 64%) 0 0/1.7em 100% repeat-x}
.ly.avocado{width:86%;height:.62em;border-radius:.45em;background:linear-gradient(#d9e892,#93b44c);box-shadow:inset 0 0 0 .1em #3f5b1e}
.ly.kimchi{width:99%;height:.62em;border-radius:.25em .5em .25em .5em;background:repeating-linear-gradient(100deg,#d8432a 0 .55em,#f08a4a .55em .85em,#f7e6c4 .85em 1.05em)}
.ly.shrimp{width:93%;height:.66em;background:radial-gradient(circle at 50% 100%,transparent .18em,#f2905e .2em,#ffb88e .36em,transparent .4em) 0 0/1.15em 100% repeat-x}
.t-mood{margin:4px 0 0;font-size:12px;color:var(--ink-soft);font-style:italic}
.stack.big .ly:last-child{animation:drop .18s ease-out}

/* 오버레이 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,22,22,.8);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.card h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;color:var(--ketchup);margin:0 0 6px;text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px;text-wrap:balance}
.card p{margin:0 0 12px;line-height:1.6}
.card ol{margin:0 0 14px;padding-left:20px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.keys{font-size:13px;color:var(--ink-soft);background:rgba(0,0,0,.05);border-radius:8px;padding:8px 10px;margin-bottom:16px;line-height:1.7}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:12px 0 18px;font-size:15px}
.stats dd{margin:0;font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}
.verdict{font-family:var(--display);font-size:18px;padding:8px 12px;border-radius:8px;margin-bottom:14px}
.verdict.ok{background:#e1f4d6;color:#2f6d1d}
.verdict.no{background:#fbe0da;color:#a52a17}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.primary{border:0;border-radius:12px;padding:12px 20px;background:var(--ketchup);color:#fff;font-family:var(--display);font-size:20px;cursor:pointer;box-shadow:0 4px 0 #94291a}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #94291a}
.secondary{border:0;border-radius:12px;padding:12px 16px;background:rgba(0,0,0,.07);color:var(--ink);font-family:var(--display);font-size:17px;cursor:pointer}
.best{font-size:13px;color:var(--ink-soft);margin-top:14px}
.nick-lbl{display:block;font-family:var(--display);font-size:15px;margin:4px 0 6px}
.nick{box-sizing:border-box;width:100%;font:inherit;font-family:var(--display);font-size:20px;padding:10px 12px;border:2px solid rgba(34,28,23,.25);border-radius:10px;background:#fff;color:var(--ink);margin-bottom:12px}
.nick:focus{outline:none;border-color:var(--ketchup)}
.nick-err{color:var(--ketchup);font-size:13px;margin:-6px 0 10px!important}
.nick-help{font-size:12px;color:var(--ink-soft);margin:-4px 0 14px!important;line-height:1.5}
.nick-lbl .opt{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.top3{margin-top:18px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mode-btn{border:2px solid rgba(34,28,23,.2);border-radius:10px;padding:10px 6px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.mode-btn b{font-family:var(--display);font-weight:400;font-size:17px}
.mode-btn small{font-size:13px;color:var(--ink-soft);word-break:keep-all}
.mode-btn[aria-pressed="true"] b::before{content:'✓ '}
.mode-btn[aria-pressed="true"]{border-color:var(--ketchup);background:#fdebc2}
.mode-btn:focus-visible{outline:2px solid var(--ketchup);outline-offset:2px}
.r-mode{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,.07);font-family:var(--body);font-size:10px;color:var(--ink-soft);vertical-align:2px;white-space:nowrap}
.rank-wrap{overflow-x:auto;margin-bottom:16px}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rank th{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-align:left;font-weight:400;padding:4px 8px;border-bottom:1px solid rgba(34,28,23,.2)}
.rank td{padding:7px 8px;border-bottom:1px dashed rgba(34,28,23,.12)}
.rank td:first-child{font-family:var(--display);width:2.5em}
.rank td:nth-child(2){font-family:var(--display);word-break:break-all}
.rank tbody tr:nth-child(-n+3) td:first-child{color:var(--ketchup)}
.rank tr.me td{background:#fdebc2}
.rank-empty{color:var(--ink-soft);font-size:14px}
.final{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}
.final b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--ketchup)}
.final span{font-size:14px;color:var(--ink-soft)}
.final .final-rank{font-family:var(--display);font-size:18px;color:var(--ink)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-50px)}}
@keyframes drop{from{transform:translateY(-.8em);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{50%{transform:scale(.94)}}
@keyframes sizzle{from{transform:translateY(0)}to{transform:translateY(-1px)}}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .bins{grid-template-columns:repeat(4,1fr)}
  .kitchen{grid-template-columns:1fr}
  .grill{grid-template-columns:repeat(3,minmax(0,110px));justify-content:center}
}
@media (max-width:640px){
  .counter{gap:6px;padding:8px 6px 0}
  .seat{grid-template-columns:1fr;min-height:0;padding:22px 4px 10px;justify-items:center}
  .person{transform:scale(.8);margin-bottom:-6px}
  .mood-yay{transform:scale(.8) translateY(-6px)}
  .ticket{width:100%;box-sizing:border-box;margin-top:0;padding:7px 6px}
  .ticket .stack{display:none}
  .t-name{font-size:14px}
  .brand{font-size:24px;width:100%}
  .stat{flex:1}
}

  <section class="line">

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
(function(){
const DAY_LEN = 150, COOK = 5, MAX_LAYERS = 10;
let BURN = 11;
/* 난이도: burn 패티가 타는 시각, free 자유 주문 비율, n 자유 주문 속재료 수, maxLen 메뉴 최대 길이, spawn 손님 간격 배율 */
const DIFFS = {
  easy:  {label:'쉬움',   ex:'짧은 버거', burn:16, free:.15, n:[2,3], maxLen:5,  spawn:1.3},
  normal:{label:'보통',   ex:'기본',      burn:11, free:.25, n:[2,5], maxLen:99, spawn:1},
  hard:  {label:'어려움', ex:'긴 버거·빨리 탐', burn:8, free:.45, n:[3,6], maxLen:99, spawn:.75}
};
let difficulty = 'normal';
const ING = {bottom:'아래빵', top:'위빵', patty:'패티', rawpatty:'덜 익은 패티', cheese:'치즈', lettuce:'양상추', tomato:'토마토', egg:'계란프라이',
  onion:'양파', mushroom:'버섯', pineapple:'파인애플', bacon:'베이컨', pickle:'피클', avocado:'아보카도', kimchi:'김치', shrimp:'새우'};
const BINS = [
  {k:'bottom',day:1,key:'1'},{k:'top',day:1,key:'2'},{k:'cheese',day:1,key:'3'},{k:'lettuce',day:1,key:'4'},
  {k:'tomato',day:1,key:'5'},{k:'egg',day:1,key:'6'},{k:'onion',day:1,key:'7'},{k:'mushroom',day:1,key:'8'},
  {k:'pineapple',day:1,key:'9'},{k:'bacon',day:1,key:'0'},{k:'pickle',day:1,key:'a'},{k:'avocado',day:1,key:'s'},
  {k:'kimchi',day:1,key:'d'},{k:'shrimp',day:1,key:'f'}
];
const METAPHOR = {
  bottom:['황금빛 대지','따스한 땅','갈색 방석','폭신한 바닥'],
  top:['별이 박힌 하늘','황금 지붕','참깨 언덕','폭신한 표지'],
  patty:['갈색 심장','숯불 돌','묵직한 북','갈색 훈장'],
  cheese:['노란 노을','햇살 한 장','금빛 담요','생쥐의 보물'],
  lettuce:['초록 들판','푸른 치맛자락','초록 레이스','숲의 손수건'],
  tomato:['여름 해','붉은 뺨','빨간 창문','붉은 원반'],
  egg:['노른자 섬','하얀 꽃','반숙의 약속','흰 들꽃'],
  onion:['눈물 고리','보랏빛 반지','매운 비밀','투명한 동그라미'],
  mushroom:['요정의 우산','갈색 양산','숲의 귀','조용한 종'],
  pineapple:['노란 왕관','달콤한 바퀴','열대의 고리','여름 방학 조각'],
  bacon:['붉은 비단 띠','줄무늬 리본','줄무늬 깃발','붉은 물결'],
  pickle:['초록 동전','연둣빛 단추','오이의 꿈','초록 메달'],
  avocado:['초록 달빛','공룡 알','숲의 버터','매끈한 조각'],
  kimchi:['장독대 이야기','불꽃놀이 잎','매콤한 잎사귀','새콤한 고향'],
  shrimp:['분홍 초승달','바다의 춤꾼','주황 쉼표','바다 손님']
};
const MENU = [
  {name:'첫 번째 약속',     st:['bottom','patty','top'], day:1},
  {name:'노을 한 조각',     st:['bottom','patty','cheese','top'], day:1},
  {name:'여름 들판',        st:['bottom','patty','lettuce','tomato','top'], day:1},
  {name:'아침 식탁',        st:['bottom','egg','cheese','patty','top'], day:1},
  {name:'빵 없는 정원',     st:['lettuce','patty','tomato','cheese','lettuce'], day:1},
  {name:'계란 두 개의 오후', st:['bottom','egg','egg','top'], day:1},
  {name:'숲속 산책',        st:['bottom','mushroom','patty','onion','top'], day:1},
  {name:'남쪽 섬의 휴가',   st:['bottom','patty','pineapple','cheese','top'], day:1},
  {name:'거꾸로 버거',      st:['top','patty','cheese','bottom'], day:1},
  {name:'두 겹의 노을',     st:['bottom','patty','cheese','patty','cheese','top'], day:1},
  {name:'연기 나는 오솔길', st:['bottom','patty','bacon','cheese','top'], day:1},
  {name:'새콤한 웃음',      st:['bottom','patty','pickle','pickle','cheese','top'], day:1},
  {name:'초록 달빛 정원',   st:['bottom','lettuce','avocado','egg','top'], day:1},
  {name:'두툼한 서사시',    st:['bottom','lettuce','patty','cheese','bacon','tomato','pickle','top'], day:1},
  {name:'바다와 장독대',    st:['bottom','shrimp','kimchi','cheese','top'], day:1},
  {name:'할머니의 바다',    st:['bottom','kimchi','patty','shrimp','egg','top'], day:1},
  {name:'빵 사이의 파도',   st:['bottom','shrimp','pineapple','avocado','top'], day:1},
  {name:'하늘과 하늘 사이', st:['top','shrimp','lettuce','top'], day:1}
];
const FREE_TITLES = ['이름 없는 시','오늘의 즉흥곡','꿈에서 본 버거','바람이 정한 순서','엉뚱한 상상','아무도 몰랐던 조합'];
const SKIN=['#f5d0a9','#e8b48a','#c68a5a','#8d5a3b','#f1c27d','#ffdcc0'];
const HAIR=['#2b1b12','#5a3a1e','#d9a441','#a33b20','#3b3b3b','#e8e2d6'];
const SHIRT=['#3d7dd8','#e06a4a','#7c4bc4','#2f9e6e','#e3a21a','#d94f8a'];

const $ = id => document.getElementById(id);
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const fmtN = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

/* ---------- 소리 ---------- */
let actx = null, soundOn = true;
function tone(f, d=.09, type='square', vol=.035, delay=0){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
  }catch(e){}
}
const sfx = {
  add(){ tone(520,.06,'triangle',.05); },
  good(){ tone(660,.1,'square',.04); tone(880,.12,'square',.04,.09); tone(1320,.16,'square',.035,.18); },
  bad(){ tone(180,.22,'sawtooth',.04); },
  leave(){ tone(240,.15,'triangle',.05); tone(160,.25,'triangle',.05,.12); },
  grill(){ tone(300,.05,'triangle',.04); },
  ding(){ tone(1046,.15,'sine',.05); }
};

/* ---------- 상태 ---------- */
let S, seatRefs = [], grillRefs = [], cid = 0, msgTimer = 0;
function newState(day, total){
  return {day, total, served:0, missed:0, skipped:0, rawServed:0, wrong:0, burnt:0,
    time:DAY_LEN, seats:[null,null,null], plate:[], grill:[null,null,null], spawnT:.6, running:false, mode:'start'};
}
function makeCustomer(day){
  let name, st;
  const D = DIFFS[difficulty], chance = D.free;
  if(Math.random() < chance){
    const fillings = ['patty', ...BINS.filter(b => b.day <= day && b.k !== 'bottom' && b.k !== 'top').map(b => b.k)];
    const mid = [], n = D.n[0] + Math.floor(Math.random()*(D.n[1] - D.n[0] + 1));
    for(let i=0;i<n;i++) mid.push(pick(fillings));
    const r1 = Math.random(), r2 = Math.random();
    const first = r1 < .8 ? 'bottom' : r1 < .9 ? 'lettuce' : 'top';
    const last  = r2 < .8 ? 'top' : r2 < .9 ? 'lettuce' : 'bottom';
    st = [first, ...mid, last]; name = pick(FREE_TITLES);
  } else {
    const all = MENU.filter(m => m.day <= day), short = all.filter(m => m.st.length <= D.maxLen);
    let pool = short.length ? short : all;
    if(difficulty === 'hard' && Math.random() < .6){ const long = pool.filter(m => m.st.length >= 6); if(long.length) pool = long; }
    const fresh = pool.filter(m => m.day === Math.min(day,4));
    const m = (fresh.length && Math.random() < .45) ? pick(fresh) : pick(pool);
    st = m.st.slice(); name = m.name;
  }
  const max = Math.max(28, 52 - (day-1)*4) + Math.max(0, st.length-4)*3;
  const initial = orderMode === 'initial' ? true : orderMode === 'poem' ? false : Math.random() < .35;
  return {id:++cid, name, st, initial, poem:poemFor(st, initial), max, p:max, state:'wait', leaveT:0,
    look:{skin:pick(SKIN), hair:pick(HAIR), shirt:pick(SHIRT)}};
}

const MODES = {
  initial:{label:'첫 글자', ex:'양○○'},
  poem:{label:'비유', ex:'초록 들판'},
  mix:{label:'섞어서', ex:'둘 다'}
};
/* 주문표: 버거 모양 그대로 위 → 아래, 같은 재료가 이어지면 ×2 */
const initialOf = k => ING[k][0] + '○'.repeat(ING[k].length - 1);
function poemFor(st, initial){
  const runs = [];
  st.forEach(k => {
    const r = runs[runs.length-1];
    if(r && r.k === k) r.n++; else runs.push({k, n:1, ph: initial ? initialOf(k) : pick(METAPHOR[k])});
  });
  return runs.reverse().map(r => `<li>${r.ph}${r.n > 1 ? ` <span class="x">×${r.n}</span>` : ''}</li>`).join('');
}
function answerFor(st){
  const runs = [];
  st.forEach(k => { const r = runs[runs.length-1]; if(r && r.k === k) r.n++; else runs.push({k, n:1}); });
  return runs.reverse().map(r => `<li>${ING[r.k]}${r.n > 1 ? ` <span class="x">×${r.n}</span>` : ''}</li>`).join('');
}
function bookHTML(){
  const open = ['patty', ...BINS.filter(b => b.day <= S.day).map(b => b.k)];
  const keys = Object.keys(METAPHOR).filter(k => open.includes(k));
  const more = Object.keys(METAPHOR).length - keys.length;
  return `<dl class="book">${keys.map(k => `<dt>${ING[k]}</dt><dd>${METAPHOR[k].join(' · ')}</dd>`).join('')}</dl>`
    + (more ? `<p class="best">아직 열리지 않은 재료 ${more}가지의 비유는 그날이 되면 보여요.</p>` : '');
}

/* ---------- 그리기 ---------- */
const layerHTML = k => `<div class="ly ${k}" title="${ING[k]}"></div>`;
const stackHTML = (arr, cls) => `<div class="stack ${cls}">${arr.map(layerHTML).join('')}</div>`;

function renderSeats(){
  const keys = ['Q','W','E'];
  $('counter').innerHTML = S.seats.map((c,i) => {
    if(!c) return `<div class="seat-wrap"><button class="seat empty" type="button" disabled>빈 자리</button></div>`;
    const bubble = c.state==='happy' ? (c.raw ? `<div class="bubble bad">패티가 덜 익었어요…</div>` : `<div class="bubble">맛있어요!</div>`) : c.state==='angry' ? `<div class="bubble bad">다음에 올게요</div>` : '';
    return `<div class="seat-wrap"><button class="seat${c.state!=='wait'?' leaving':''}" type="button" data-i="${i}" aria-label="${i+1}번 손님에게 서빙: ${c.name}">
      <span class="key">${keys[i]}</span>${bubble}
      <div class="person mood-ok" style="--skin:${c.look.skin};--hair:${c.look.hair};--shirt:${c.look.shirt}">
        <div class="head"><i class="hair"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i class="blush"></i></div>
        <div class="torso"></div>
      </div>
      <div class="ticket">
        <div class="t-name">「${c.name}」${c.initial ? '<span class="t-kind">첫 글자</span>' : ''}</div>
        ${c.reveal ? `<span class="t-answer">정답</span><ol class="t-lines answer">${answerFor(c.st)}</ol>` : `<ol class="t-lines${c.initial ? ' initial' : ''}">${c.poem}</ol>`}
      </div>
    </button>${c.state === 'wait' ? `<button class="skip" type="button" data-skip="${i}" aria-label="${i+1}번 손님 보내기">다음 손님 <small>-5초</small></button>` : '<span class="skip-gap"></span>'}</div>`;
  }).join('');
  seatRefs = [...$('counter').children].map(w => { const el = w.querySelector('.seat'); return {el, person:el.querySelector('.person')}; });
}

function renderPlate(){
  $('plate').innerHTML = S.plate.map(layerHTML).join('');
  $('plateEmpty').hidden = S.plate.length > 0;
}

function renderBins(){
  $('bins').innerHTML = BINS.map((b,i) => {
    const locked = b.day > S.day;
    return `<button class="bin" type="button" data-k="${b.k}" ${locked?'disabled':''} aria-label="${ING[b.k]} 올리기">
      <kbd>${b.key.toUpperCase()}</kbd>${stackHTML([b.k],'bin-stack')}
      <span class="nm">${ING[b.k]}</span>${locked?`<span class="lock">DAY ${b.day}부터</span>`:''}
    </button>`;
  }).join('');
}

function buildGrill(){
  $('grill').innerHTML = [0,1,2].map(i => `<button class="slot" type="button" data-g="${i}" aria-label="그릴 ${i+1}번 칸">
    <div class="gp none"></div><div class="gbar"><i></i></div><div class="glabel">비어 있음</div></button>`).join('');
  grillRefs = [...$('grill').children].map(el => ({el, gp:el.querySelector('.gp'), bar:el.querySelector('.gbar i'), lbl:el.querySelector('.glabel'), st:''}));
}

function lerpColor(a, b, t){
  const pa = a.match(/\w\w/g).map(h=>parseInt(h,16)), pb = b.match(/\w\w/g).map(h=>parseInt(h,16));
  return `rgb(${pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')})`;
}

function drawGrill(){
  S.grill.forEach((g,i) => {
    const r = grillRefs[i];
    let st, w, label;
    if(!g){ st='none'; w=0; label='비어 있음'; }
    else if(g.t < COOK){ st='cooking'; w=g.t/COOK; label='굽는 중…<br>지금 담으면 덜 익음'; }
    else if(g.t < BURN){ st='done'; w=1-(g.t-COOK)/(BURN-COOK); label='다 익었어요!<br>눌러서 담기'; }
    else { st='burnt'; w=1; label='탔어요<br>눌러서 버리기'; }
    if(r.st !== st){
      r.st = st;
      r.gp.className = 'gp ' + st;
      r.bar.className = st;
      r.lbl.className = 'glabel ' + st;
      r.lbl.innerHTML = label;
      if(st === 'done') sfx.ding();
    }
    r.bar.style.width = (w*100).toFixed(1) + '%';
    r.gp.style.background = !g ? '' : g.t < COOK ? lerpColor('e58f97','6a3a1d', g.t/COOK) : g.t < BURN ? lerpColor('6a3a1d','3a2010',(g.t-COOK)/(BURN-COOK)) : '';
  });
}

function drawHUD(){
  const t = Math.max(0, Math.ceil(S.time));
  $('time').textContent = t + '초';
  $('timeBox').classList.toggle('warn', S.running && S.time < 15);
  $('earn').textContent = fmtN(S.served) + '개';
  $('timefill').style.width = (S.time / DAY_LEN * 100) + '%';
}

function drawSeats(){
  S.seats.forEach((c,i) => {
    const r = seatRefs[i];
    if(!c || !r || !r.person) return;
    const mood = c.state === 'happy' ? 'yay' : 'ok';
    const cls = 'person mood-' + mood;
    if(r.person.className !== cls) r.person.className = cls;
  });
}

function say(text, kind=''){
  const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.textContent=''; m.className='msg'; }, 2200);
}

/* ---------- 행동 ---------- */
function addLayer(k){
  if(!S.running) return;
  const b = BINS.find(x => x.k === k);
  if(b && b.day > S.day) return;
  if(S.plate.length >= MAX_LAYERS) return say('접시가 꽉 찼어요!', 'bad');
  S.plate.push(k); renderPlate(); sfx.add();
  const btn = document.querySelector(`.bin[data-k="${k}"]`);
  if(btn){ btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
}
function addPatty(){
  if(!S.running) return;
  const i = S.grill.findIndex(g => !g);
  if(i < 0) return say('그릴이 꽉 찼어요', 'bad');
  S.grill[i] = {t:0}; sfx.grill();
}
function grillClick(i){
  if(!S.running) return;
  const g = S.grill[i];
  if(!g) return addPatty();
  if(g.t >= BURN){ S.grill[i] = null; S.burnt++; return say('탄 패티를 버렸어요'); }
  if(S.plate.length >= MAX_LAYERS) return say('접시가 꽉 찼어요!', 'bad');
  const raw = g.t < COOK;
  S.grill[i] = null; S.plate.push(raw ? 'rawpatty' : 'patty'); renderPlate(); sfx.add();
}
function takeCookedPatty(){
  const i = S.grill.findIndex(g => g && g.t >= COOK && g.t < BURN);
  if(i >= 0) return grillClick(i);
  const b = S.grill.findIndex(g => g && g.t >= BURN);
  if(b >= 0) return grillClick(b);
  say('다 익은 패티가 없어요', 'bad');
}
function undo(){ if(!S.running || !S.plate.length) return; S.plate.pop(); renderPlate(); }
function trash(){ if(!S.running || !S.plate.length) return; S.plate = []; renderPlate(); say('접시를 비웠어요'); }

function serve(i){
  if(!S.running) return;
  const c = S.seats[i];
  if(!c || c.state !== 'wait') return;
  if(!S.plate.length) return say('먼저 버거를 만들어 주세요', 'bad');
  const ok = S.plate.length === c.st.length && S.plate.every((k,j) => (k === 'rawpatty' ? 'patty' : k) === c.st[j]);
  if(ok){
    const raw = S.plate.includes('rawpatty'), pts = raw ? .5 : 1;
    S.served += pts; S.total += pts; if(raw) S.rawServed++;
    c.state = 'happy'; c.leaveT = 1.1; c.raw = raw;
    S.plate = []; renderPlate(); renderSeats();
    const f = document.createElement('div'); f.className = 'float';
    f.textContent = '+' + pts + '개';
    seatRefs[i].el.appendChild(f);
    say(raw ? `덜 익은 패티가 들어갔어요! 0.5개만 인정돼요 · 지금까지 ${fmtN(S.served)}개` : `서빙 완료! 지금까지 ${fmtN(S.served)}개`, raw ? 'bad' : 'good');
    sfx.good();
  } else {
    S.wrong++;
    const el = seatRefs[i].el; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    say('주문과 달라요! 주문표를 다시 읽어 보세요', 'bad'); sfx.bad();
  }
}

const SKIP_COST = 5;
function skipCustomer(i){
  if(!S.running) return;
  const c = S.seats[i];
  if(!c || c.state !== 'wait') return;
  c.state = 'angry'; c.leaveT = 2; c.reveal = true; S.skipped++;
  S.time = Math.max(0, S.time - SKIP_COST);
  renderSeats(); sfx.leave();
  say(`손님을 보냈어요 · ${SKIP_COST}초 줄었어요`, 'bad');
}

/* ---------- 게임 루프 ---------- */
function update(dt){
  S.time -= dt;
  if(S.time <= 0){ S.time = 0; return endDay(); }
  if(S.time > 4){
    S.spawnT -= dt;
    if(S.spawnT <= 0){
      const free = S.seats.findIndex(s => !s);
      if(free >= 0){
        S.seats[free] = makeCustomer(S.day); renderSeats();
        S.spawnT = Math.max(2.5, rand(5,10) - (DAY_LEN - S.time) / 30) * DIFFS[difficulty].spawn;
      }
    }
  }
  let dirty = false;
  S.seats.forEach((c,i) => {
    if(!c) return;
    if(c.state !== 'wait'){
      c.leaveT -= dt;
      if(c.leaveT <= 0){ S.seats[i] = null; S.spawnT = Math.max(S.spawnT, 1.2); dirty = true; }
    }
  });
  if(dirty) renderSeats();
  S.grill.forEach(g => { if(g) g.t += dt; });
}

let last = 0;
function frame(ts){
  const dt = last ? Math.min(.1, (ts-last)/1000) : 0; last = ts;
  if(S.running) update(dt);
  drawHUD(); drawSeats(); drawGrill();
  requestAnimationFrame(frame);
}

/* ---------- 화면 전환 ---------- */
function showOverlay(html, mode){
  S.mode = mode; $('card').innerHTML = html; $('overlay').hidden = false;
  const btn = $('card').querySelector('.primary'); if(btn) btn.focus();
}
function hideOverlay(){ $('overlay').hidden = true; S.mode = 'play'; }

/* ---------- 닉네임 · 랭킹 ---------- */
let orderMode = 'mix', nick = '', nickDraft = '', phone = '', uid = null, lastRunId = null, lastEndHTML = '', saveNote = '', rankBack = null, saving = false;
try{ nickDraft = localStorage.getItem('dutum-nick') || ''; }catch(e){}
try{ const m = localStorage.getItem('dutum-mode'); if(MODES[m]) orderMode = m; }catch(e){}
try{ const d = localStorage.getItem('dutum-diff'); if(DIFFS[d]) difficulty = d; }catch(e){}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone = d => d.startsWith('02') ? d.replace(/^(\d{2})(\d{3,4})(\d{4})$/, '$1-$2-$3') : d.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
const R = {db:null, rows:[], status:'loading'};
const byScore = (a,b) => (b.total - a.total) || (b.day - a.day) || (a.at - b.at);
function cleanRow(id, d){
  if(!d || typeof d.nick !== 'string' || !d.nick.trim()) return null;
  return {id, nick:d.nick.slice(0,12), total:Math.max(0, Math.round((+d.total || 0) * 2) / 2), day:Math.max(1, Math.floor(+d.day || 1)), at:+d.at || 0, mode:MODES[d.mode] ? d.mode : '', diff:DIFFS[d.diff] ? d.diff : ''};
}
function localRows(){
  try{ return (JSON.parse(localStorage.getItem('dutum-rank')) || []).map(r => cleanRow(r.id, r)).filter(Boolean).sort(byScore); }catch(e){ return []; }
}
function saveLocal(run){
  try{ const a = localRows(); a.push(run); a.sort(byScore); localStorage.setItem('dutum-rank', JSON.stringify(a.slice(0,100))); }catch(e){}
}
async function initRanking(){
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ R.status = 'local'; R.rows = localRows(); return refreshRank(); }
  R.db = db;
  window.claude.use('user').then(u => u ? u.id() : null).then(id => { uid = id || null; }).catch(() => { uid = null; });
  const timer = setTimeout(() => { if(R.status === 'loading'){ R.status = 'stale'; refreshRank(); } }, 10000);
  db.collection('scores').orderBy('total','desc').limit(200).onSnapshot(snap => {
    R.rows = snap.docs.map(d => cleanRow(d.id, d.data())).filter(Boolean).sort(byScore);
    if(!snap.metadata.fromCache){ clearTimeout(timer); R.status = 'shared'; }
    refreshRank();
  }, () => { clearTimeout(timer); R.db = null; R.status = 'local'; R.rows = localRows(); refreshRank(); });
}
async function saveRun(){
  const run = {nick, total:S.total, day:S.day, at:Date.now(), mode:orderMode, diff:difficulty};
  if(R.db){
    try{
      const ref = await R.db.collection('scores').add(run);
      run.id = lastRunId = ref.id; saveNote = '공유 랭킹에 저장했어요.';
      if(!R.rows.some(r => r.id === run.id)){ R.rows.push(run); R.rows.sort(byScore); }
      if(phone) saveNote += await savePhone(run);
      return run;
    }catch(e){ saveNote = '공유 랭킹에 저장할 수 없어서 이 기기에만 저장했어요.'; }
  } else saveNote = '이 기기의 랭킹에 저장했어요.';
  run.id = lastRunId = 'local-' + run.at; saveLocal(run);
  if(phone) saveNote += ' 전화번호는 저장되지 않았어요.';
  if(!R.db) R.rows = localRows();
  return run;
}
async function savePhone(run){
  if(!uid) return ' 전화번호는 저장되지 않았어요.';
  try{
    await R.db.collection('contacts/' + uid + '/runs').add({nick, phone, total:run.total, scoreId:run.id, at:run.at});
    /* 만든 사람이 전화번호를 모아 볼 수 있도록 사용자별 목록 문서도 남김 */
    await R.db.doc('contacts/' + uid).set({nick, phone, at:run.at});
    return ' 전화번호는 만든 사람만 볼 수 있게 저장했어요.';
  }catch(e){ return ' 전화번호는 저장하지 못했어요.'; }
}
const rankOf = run => 1 + R.rows.filter(r => r.id !== run.id && byScore(r, run) < 0).length;
function statusLine(){
  return {loading:'랭킹을 불러오는 중이에요.', shared:'이 페이지를 여는 모든 사람이 같은 랭킹을 봐요.',
    local:'이 기기에만 저장되는 랭킹이에요.', stale:'랭킹에 아직 연결되지 않았어요. 보이는 기록이 최신이 아닐 수 있어요.'}[R.status];
}
function rankTable(n){
  if(!R.rows.length) return `<p class="rank-empty">${R.status === 'loading' ? '랭킹을 불러오는 중이에요…' : '아직 기록이 없어요. 첫 번째 사장님이 되어 보세요!'}</p>`;
  return `<div class="rank-wrap"><table class="rank"><thead><tr><th>순위</th><th>닉네임</th><th>버거</th><th>날짜</th></tr></thead><tbody>${
    R.rows.slice(0,n).map((r,i) => `<tr class="${r.id === lastRunId ? 'me' : ''}"><td>${i+1}</td><td>${esc(r.nick)}${r.mode || r.diff ? `<span class="r-mode">${[r.diff && DIFFS[r.diff].label, r.mode && MODES[r.mode].label].filter(Boolean).join('·')}</span>` : ''}</td><td>${fmtN(r.total)}개</td><td>${r.at ? new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}) : ''}</td></tr>`).join('')
  }</tbody></table></div>`;
}
function openRank(back){
  rankBack = back;
  showOverlay(`<h2>명예의 주방</h2><p class="best" id="rankStatus">${statusLine()}</p><div id="rankBody">${rankTable(20)}</div>
    <div class="btns"><button class="primary" type="button" data-act="rankClose">닫기</button></div>`, 'rank');
}
function refreshRank(){
  const body = $('rankBody'); if(body) body.innerHTML = rankTable(20);
  const st = $('rankStatus'); if(st) st.textContent = statusLine();
  const top = $('startTop'); if(top) top.innerHTML = rankTable(3);
}
function backFor(){
  if(S.mode === 'play'){ S.running = false; return () => showPauseCard(); }
  if(S.mode === 'pause') return () => showPauseCard();
  if(S.mode === 'end'){ const h = lastEndHTML; return () => showOverlay(h, 'end'); }
  return showStart;
}

function pickHTML(group, title, opts, cur){
  return `<div class="nick-lbl" id="${group}Lbl">${title}</div>
    <div class="modes" role="group" aria-labelledby="${group}Lbl">${Object.entries(opts).map(([k, m]) =>
      `<button class="mode-btn" type="button" data-pick="${group}" data-v="${k}" aria-pressed="${k === cur}"><b>${m.label}</b><small>${m.ex}</small></button>`).join('')}</div>`;
}
function showStart(){
  showOverlay(`
    <h1>두툼버거 주방</h1>
    <p>오늘부터 버거 가게 사장님! 손님 주문표를 보고 버거를 <b>아래에서부터</b> 차곡차곡 쌓아 주세요.</p>
    <ol>
      <li>그릴에 <b>생패티</b>를 올리고, 갈색으로 익으면 눌러서 접시에 담아요. 덜 익었을 때 담으면 그 버거는 <b>0.5개</b>로만 쳐요. 너무 오래 두면 타요.</li>
      <li>주문표는 <b>버거 모양 그대로</b> 맨 위 재료부터 적혀 있어요. 재료 이름은 <b>비유</b>(초록 들판 = 양상추)나 <b>첫 글자</b>(양○○ = 양상추)로 적혀 있어요.</li>
      <li>다 만들면 <b>손님을 눌러</b> 서빙해요. 손님은 버거가 나올 때까지 기다려 줘요.</li>
      <li>장사는 딱 하루, <b>150초</b>예요. 그동안 낸 버거 개수가 랭킹에 올라가요. 시간이 갈수록 손님이 더 자주 와요.</li>
    </ol>
    <p>버거라고 늘 빵으로 시작하지는 않아요. 빵 없이 잎으로 감싸거나, 거꾸로 뒤집힌 주문도 있어요. 주문표에 적힌 순서가 정답이에요.</p>
    <div class="keys">키보드: <kbd>1</kbd>~<kbd>0</kbd>, <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> 재료 · <kbd>P</kbd> 패티 굽기 · <kbd>Space</kbd> 익은 패티 담기 · <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> 서빙 · <kbd>Z</kbd> 빼기 · <kbd>X</kbd> 버리기</div>
    ${pickHTML('mode', '주문표는 어떻게 받을까요?', MODES, orderMode)}
    ${pickHTML('diff', '난이도', DIFFS, difficulty)}
    <label class="nick-lbl" for="nickInput">이번 게임 닉네임</label>
    <input class="nick" id="nickInput" maxlength="12" autocomplete="off" placeholder="예: 버거왕" value="${esc(nickDraft)}">
    <p class="nick-err" id="nickErr" hidden>닉네임을 한 글자 이상 적어 주세요.</p>
    <label class="nick-lbl" for="phoneInput">전화번호 <span class="opt">(선택)</span></label>
    <input class="nick" id="phoneInput" type="tel" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="010-0000-0000">
    <p class="nick-err" id="phoneErr" hidden>전화번호를 숫자 10~11자리로 적어 주세요. 안 적어도 돼요.</p>
    <p class="nick-help">적지 않아도 게임할 수 있어요. 적으면 랭킹에는 나오지 않고, 이 게임을 만든 사람만 볼 수 있게 따로 저장돼요.</p>
    <div class="btns"><button class="primary" type="button" data-act="start">영업 시작</button><button class="secondary" type="button" data-act="rank">랭킹 보기</button></div>
    <div class="top3"><div class="nick-lbl">랭킹 TOP 3</div><div id="startTop">${rankTable(3)}</div></div>`, 'start');

function startGame(){
  const input = $('nickInput');
  const v = (input ? input.value : '').trim().slice(0, 12);
  if(!v){ $('nickErr').hidden = false; input && input.focus(); return; }
  const pIn = $('phoneInput'), raw = pIn ? pIn.value.trim() : '', digits = raw.replace(/\D/g, '');
  if(raw && !/^0\d{8,10}$/.test(digits)){ $('phoneErr').hidden = false; pIn.focus(); return; }
  phone = digits ? fmtPhone(digits) : '';
  nick = nickDraft = v; lastRunId = null; BURN = DIFFS[difficulty].burn;
  try{ localStorage.setItem('dutum-nick', v); }catch(e){}
  startDay(1, 0);
}
function startDay(d, total){
  S = newState(d, total);
  $('nickShow').textContent = nick + ' 사장님';
  renderSeats(); renderPlate(); renderBins(); hideOverlay();
  S.running = true; last = 0;
  say('영업 시작!', 'good');
}
function showPauseCard(book){
  showOverlay(`<h2>잠깐 쉬는 중</h2><p>${esc(nick)} 사장님, 게임이 멈춰 있어요. 준비되면 계속하세요.</p>

function pause(book){

}
function resume(){ hideOverlay(); S.running = true; last = 0; }

function endDay(){

async function gameOver(reason, full){

/* ---------- 입력 ---------- */
$('card').addEventListener('click', e => {
  const mb = e.target.closest('[data-pick]');
  if(mb){
    const g = mb.dataset.pick, v = mb.dataset.v;
    if(g === 'mode') orderMode = v; else difficulty = v;
    try{ localStorage.setItem(g === 'mode' ? 'dutum-mode' : 'dutum-diff', v); }catch(e){}
    $('card').querySelectorAll(`[data-pick="${g}"]`).forEach(b => b.setAttribute('aria-pressed', b === mb));

  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(!act) return;
  if(act === 'start') return startGame();
  if(act === 'resume') return resume();
  if(act === 'quit') return gameOver('영업을 여기서 마쳤어요.');
  if(act === 'new') return showStart();
  if(act === 'rank') return openRank(backFor());
  if(act === 'rankClose'){ const b = rankBack || showStart; rankBack = null; return b(); }
});
$('card').addEventListener('input', e => {
  if(e.target.id === 'nickInput'){ nickDraft = e.target.value; $('nickErr').hidden = true; }
  if(e.target.id === 'phoneInput') $('phoneErr').hidden = true;
});
$('rankBtn').addEventListener('click', () => { if(S.mode !== 'rank' && S.mode !== 'saving') openRank(backFor()); });
$('counter').addEventListener('click', e => {
  const k = e.target.closest('[data-skip]'); if(k) return skipCustomer(+k.dataset.skip);
  const s = e.target.closest('.seat[data-i]'); if(s) serve(+s.dataset.i);
});
$('bins').addEventListener('click', e => { const b = e.target.closest('.bin'); if(b && !b.disabled) addLayer(b.dataset.k); });
$('grill').addEventListener('click', e => { const s = e.target.closest('.slot'); if(s) grillClick(+s.dataset.g); });
$('addPatty').addEventListener('click', addPatty);
$('undo').addEventListener('click', undo);
$('trash').addEventListener('click', trash);
$('pauseBtn').addEventListener('click', () => pause());
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '소리 켬' : '소리 끔';
  $('soundBtn').setAttribute('aria-pressed', soundOn);
});
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(S.mode !== 'play'){
    let btn = null;
    if(k === 'enter' && e.target.tagName !== 'BUTTON') btn = $('card').querySelector('.primary');
    if(k === 'escape') btn = $('card').querySelector(S.mode === 'pause' ? '[data-act="resume"]' : S.mode === 'rank' ? '[data-act="rankClose"]' : '.none');
    if(btn){ e.preventDefault(); btn.click(); }
    return;
  }
  const bin = BINS.find(b => b.key === k);
  if(bin){ addLayer(bin.k); return; }
  const map = {p:addPatty, ' ':takeCookedPatty, z:undo, x:trash, q:()=>serve(0), w:()=>serve(1), e:()=>serve(2), r:()=>openRank(backFor()), escape:()=>pause()};
  if(map[k]){ e.preventDefault(); map[k](); }
});
document.addEventListener('visibilitychange', () => { if(document.hidden) pause(); });

/* ---------- 시작: 주문 하나가 걸린 주방을 보여 주고 안내창 띄우기 ---------- */
S = newState(1, 0);
S.seats[1] = makeCustomer(1);
S.seats[1].p = S.seats[1].max * .8;
S.grill[0] = {t:6};
S.plate = ['bottom','patty'];
buildGrill(); renderSeats(); renderPlate(); renderBins();
showStart();
initRanking();
requestAnimationFrame(frame);
})();
</script>
